name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python3 -m pip install "ruff==0.15.7"

      - name: Ruff check
        run: python3 -m ruff check .

      - name: Ruff format
        run: python3 -m ruff format . --check
